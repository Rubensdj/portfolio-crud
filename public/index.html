<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClientHub - Gestao de Clientes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOAST -->
  <div id="toast" class="toast"></div>

  <!-- TELA DE LOGIN -->
  <div class="login-container" id="loginScreen">
    <div class="glass-card">
      <h1>ClientHub</h1>
      <p class="subtitle">Sistema de Gestao de Clientes</p>

      <div class="error-msg" id="errorMsg"></div>

      <div id="loginForm">
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="seu@email.com">
        </div>
        <div class="input-group">
          <label>Senha</label>
          <input type="password" id="loginSenha" placeholder="******">
        </div>
        <button class="btn-primary" id="btnLogin" onclick="fazerLogin()">
          <span class="btn-text">Entrar</span>
          <span class="btn-spinner" style="display:none">...</span>
        </button>
        <button class="btn-secondary" onclick="mostrarRegistro()">Criar conta</button>
      </div>

      <div id="registerForm" style="display:none">
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="seu@email.com">
        </div>
        <div class="input-group">
          <label>Senha</label>
          <input type="password" id="regSenha" placeholder="minimo 6 caracteres">
        </div>
        <button class="btn-primary" id="btnRegister" onclick="registrar()">
          <span class="btn-text">Cadastrar</span>
          <span class="btn-spinner" style="display:none">...</span>
        </button>
        <button class="btn-secondary" onclick="mostrarLogin()">Voltar ao login</button>
      </div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard" id="dashboard">
    <div class="header">
      <h2>Dashboard</h2>
      <div class="user-info">
        <span id="userEmail"></span>
        <button class="btn-logout" onclick="logout()">Sair</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="label">Total Clientes</div>
        <div class="value" id="totalClientes">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Com Email</div>
        <div class="value" id="totalEmails">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Com Telefone</div>
        <div class="value" id="totalTelefones">0</div>
      </div>
    </div>

    <!-- Grafico -->
    <div class="chart-card">
      <div class="chart-header">
        <h3>Novos clientes por mes</h3>
      </div>
      <div class="chart-bars" id="chartBars"></div>
    </div>

    <!-- Formulario Add/Edit -->
    <div class="form-card" id="formCard">
      <h3 id="formTitle">Novo Cliente</h3>
      <input type="hidden" id="editId">

      <!-- Avatar -->
      <div class="avatar-section" id="avatarSection" style="display:none">
        <div class="avatar-preview">
          <img id="avatarImg" src="" alt="Avatar">
        </div>
        <label class="btn-avatar-upload">
          Trocar foto
          <input type="file" accept="image/jpeg,image/png,image/webp" onchange="uploadAvatar(this)" hidden>
        </label>
      </div>

      <div class="form-row">
        <div class="input-group">
          <label>Nome *</label>
          <input type="text" id="cliNome" placeholder="Joao Silva">
        </div>
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="cliEmail" placeholder="joao@email.com">
        </div>
      </div>
      <div class="form-row">
        <div class="input-group">
          <label>Telefone</label>
          <input type="text" id="cliTelefone" placeholder="(81) 99999-9999">
        </div>
        <div class="input-group">
          <label>Categoria</label>
          <select id="cliCategoria">
            <option value="pessoa">Pessoa Fisica</option>
            <option value="empresa">Empresa</option>
          </select>
        </div>
      </div>
      <div class="input-group">
        <label>Endereco</label>
        <input type="text" id="cliEndereco" placeholder="Rua, numero, bairro">
      </div>
      <div class="input-group">
        <label>Observacoes</label>
        <textarea id="cliObs" rows="3" placeholder="Notas sobre o cliente..."></textarea>
      </div>

      <div class="form-actions">
        <button class="btn-primary" id="btnSalvar" onclick="salvarCliente()">
          <span class="btn-text">Salvar</span>
          <span class="btn-spinner" style="display:none">...</span>
        </button>
        <button class="btn-cancel" onclick="fecharForm()">Cancelar</button>
      </div>
    </div>

    <!-- Tabela -->
    <div class="table-card">
      <div class="table-header">
        <h3>Clientes</h3>
        <div class="table-controls">
          <input type="text" id="searchInput" placeholder="Buscar..." oninput="buscarClientes()">
          <select id="filterCategoria" onchange="buscarClientes()">
            <option value="">Todas categorias</option>
            <option value="pessoa">Pessoa Fisica</option>
            <option value="empresa">Empresa</option>
          </select>
          <button class="btn-add" onclick="abrirFormNovo()">+ Novo</button>
          <button class="btn-export" onclick="exportarCSV()">Exportar CSV</button>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th></th>
            <th>Nome</th>
            <th class="hide-mobile">Email</th>
            <th class="hide-mobile">Telefone</th>
            <th class="hide-mobile">Categoria</th>
            <th class="hide-mobile">Cadastro</th>
            <th>Acoes</th>
          </tr>
        </thead>
        <tbody id="clientesTable"></tbody>
      </table>
      <div class="empty-state" id="emptyState">
        Nenhum cliente cadastrado. Clique em "+ Novo" pra comecar.
      </div>

      <!-- Paginacao -->
      <div class="paginacao" id="paginacao" style="display:none">
        <button id="btnPrev" onclick="mudarPagina(-1)">Anterior</button>
        <span id="pageInfo"></span>
        <button id="btnNext" onclick="mudarPagina(1)">Proximo</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
