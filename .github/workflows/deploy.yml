name: Deploy para Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verificar se o servidor inicia
        run: |
          timeout 5 node server.js || true

      - name: Deploy via Render API
        if: env.RENDER_API_KEY != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Triggering deploy no Render..."
          curl -s -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}' | jq -r '.status // "triggered"'

      - name: Skip deploy (secrets nao configurados)
        if: env.RENDER_API_KEY == ''
        run: |
          echo "::warning::RENDER_API_KEY e RENDER_SERVICE_ID nao configurados."
          echo "Configure nos Settings > Secrets do GitHub para ativar deploy automatico."
          echo "Veja instrucoes no README."
